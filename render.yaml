services:
  - type: web
    name: quadrift-io
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: MIN_POPULATION
        value: 16
      - key: MAX_HUMANS
        value: 40
